name: GHCR Public

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ghcr-public.yml

permissions:
  contents: read
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="${GITHUB_REPOSITORY#*/}"
          echo "package: $package"
          code=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: commandcode-universal-proxy" \
            "https://api.github.com/user/packages/container/${package}" \
            -d '{"visibility":"public"}')
          echo "HTTP ${code}"
          cat /tmp/response.json
          test "${code}" = "200"
